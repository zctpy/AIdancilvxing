<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一念共学 · 单词旅行｜上海季</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f3ea;color:#304139;font-family:system-ui,sans-serif}header{text-align:center;padding:60px 20px 35px;background:linear-gradient(140deg,#e8f1e5,#fff3e4)}small{letter-spacing:.16em;color:#b07b52}h1{font:42px Georgia,serif;margin:14px 0}header p{color:#697c70;line-height:1.8}.shell{max-width:950px;margin:auto;padding:22px}.bar{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;position:sticky;top:0;background:#f7f3eaf2;padding:12px;z-index:2;border-radius:15px}button,select{font:inherit;border:1px solid #d7dfd2;background:white;color:#344c40;border-radius:9px;padding:10px 14px;cursor:pointer}button:disabled{opacity:.4}.panel{text-align:center}h2{font:27px Georgia,serif;margin:25px 0 6px}.sub{color:#87978a;font-size:13px}.panel img{display:block;width:100%;max-width:800px;height:auto;margin:20px auto;border-radius:8px;box-shadow:0 15px 35px #493c2b22}.words{max-width:800px;margin:auto;text-align:left;background:#fffaf0;border:1px solid #d8bb80;border-radius:12px;padding:22px 25px;color:#40503f;line-height:1.9}.words b{color:#8c5d33;font-size:18px}.wordgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}.worditem{border-top:1px solid #e9dbc2;padding:12px 4px 0;line-height:1.65}.wordtitle{font:600 19px Georgia,serif;color:#315b4e}.ipa{font-size:13px;color:#9b7554;margin-left:7px}.meaning{font-size:13px;color:#a06148}.example{margin-top:5px;font-size:14px}.translation{font-size:13px;color:#78877b}footer{text-align:center;padding:36px;color:#8b998d;font-size:13px;line-height:1.8}a{color:#386c57}@media(max-width:600px){h1{font-size:30px}header{padding:38px 15px 25px}.shell{padding:10px}.bar{position:static}.wordgrid{grid-template-columns:1fr}}</style><header><small>一念共学 · LEARN TOGETHER</small><h1>单词旅行 · 上海季</h1><p>与知远和AI伙伴一起重返上海<br>在城市与故事中学习英语。</p><small>第 0—10 集 · 双语漫画</small></header><main class="shell"><nav class="bar"><a href="../">← 作品首页</a><button id="prev">← 上一集</button><select id="sel" aria-label="选择集数"></select><button id="next">下一集 →</button></nav><section class="panel"><h2 id="title"></h2><div class="sub" id="count"></div><img id="pic" alt=""><div class="words"><b>本集单词 · Vocabulary</b><div class="wordgrid" id="words"></div></div></section></main><footer>图片内部分音标可能有误，请以图片下方词汇卡为准。<br>一念共学 · 一起学习，一起旅行，一起成长</footer><script>const data={"titles": ["欢迎来到上海", "外滩的风", "南京路甜蜜寻味", "陆家嘴的星光约会", "美味的约定", "梧桐树下慢慢走", "重返上海理工", "创业的时光", "静安寺里，一笔一心", "朱家角水乡慢旅", "我们的新篇章"], "entries": [[["welcome", "ˈwelkəm", "欢迎", "Welcome to Shanghai!", "欢迎来到上海！"], ["explore", "ɪkˈsplɔːr", "探索", "Let’s explore the city.", "让我们探索这座城市。"], ["taste", "teɪst", "品尝", "Taste this local treat.", "尝尝这份当地点心。"], ["future", "ˈfjuːtʃər", "未来", "The future is full of possibilities.", "未来充满可能。"]], [["skyline", "ˈskaɪlaɪn", "天际线", "The skyline is beautiful.", "天际线真美。"], ["river", "ˈrɪvər", "河流", "The river reflects the lights.", "江水映着灯光。"], ["breeze", "briːz", "微风", "A cool breeze touches my face.", "凉爽的微风拂过我的脸。"], ["return", "rɪˈtɜːrn", "返回", "I’m happy to return to Shanghai.", "我很高兴重返上海。"]], [["fragrant", "ˈfreɪɡrənt", "芳香的", "The flowers are fragrant.", "花儿芳香。"], ["authentic", "ɔːˈθentɪk", "地道的", "Try authentic Shanghai food.", "尝尝地道的上海美食。"], ["appetite", "ˈæpɪtaɪt", "食欲", "The food whets my appetite.", "这美食让我食欲大开。"], ["desire", "dɪˈzaɪər", "渴望", "She has a desire to explore.", "她渴望探索。"]], [["skyscraper", "ˈskaɪskreɪpər", "摩天大楼", "The skyscrapers light up at night.", "摩天大楼在夜晚亮起。"], ["illuminate", "ɪˈluːmɪneɪt", "照亮", "Lights illuminate the city.", "灯光照亮城市。"], ["aspiration", "ˌæspəˈreɪʃən", "志向", "Her aspiration is to keep learning.", "她的志向是不断学习。"], ["imagine", "ɪˈmædʒɪn", "想象", "Imagine what we could create.", "想象一下我们能创造什么。"]], [["elegant", "ˈelɪɡənt", "优雅的", "The restaurant is elegant.", "这家餐厅很优雅。"], ["exquisite", "ɪkˈskwɪzɪt", "精致的", "The dishes look exquisite.", "这些菜看起来很精致。"], ["companion", "kəmˈpænjən", "同伴", "She is a thoughtful companion.", "她是位体贴的同伴。"], ["together", "təˈɡeðər", "一起", "We enjoy dinner together.", "我们一起享用晚餐。"]], [["gentle", "ˈdʒentl", "温柔的", "The afternoon light is gentle.", "午后的光线很柔和。"], ["stroll", "stroʊl", "漫步", "Let’s take a stroll.", "我们去散散步吧。"], ["nostalgia", "nɑːˈstældʒə", "怀旧", "The old street fills me with nostalgia.", "这条老街让我怀念往事。"], ["serene", "səˈriːn", "宁静的", "The garden feels serene.", "花园里一片宁静。"]], [["study", "ˈstʌdi", "学习", "I studied here for four years.", "我在这里学习了四年。"], ["youth", "juːθ", "青春", "He remembers his youth.", "他回忆起自己的青春。"], ["growth", "ɡroʊθ", "成长", "Learning brings growth.", "学习带来成长。"], ["experience", "ɪkˈspɪriəns", "经历", "Thank you for sharing your experience.", "谢谢你分享你的经历。"]], [["business", "ˈbɪznəs", "事业", "He started a business in Shanghai.", "他在上海创办过事业。"], ["challenge", "ˈtʃælɪndʒ", "挑战", "Every challenge teaches us something.", "每一次挑战都让我们有所收获。"], ["courage", "ˈkɜːrɪdʒ", "勇气", "It takes courage to try.", "尝试需要勇气。"], ["perseverance", "ˌpɜːrsəˈvɪrəns", "坚持", "Perseverance helps us move forward.", "坚持帮助我们前进。"]], [["temple", "ˈtempl", "寺院", "We visit an old temple.", "我们参观一座古寺。"], ["patience", "ˈpeɪʃəns", "耐心", "Writing takes patience.", "书写需要耐心。"], ["stillness", "ˈstɪlnəs", "宁静", "We enjoy a moment of stillness.", "我们享受片刻宁静。"], ["sacred", "ˈseɪkrɪd", "神圣的", "They enter the sacred space quietly.", "他们安静地走进庄严的空间。"]], [["ancient", "ˈeɪnʃənt", "古老的", "An ancient bridge crosses the canal.", "一座古桥横跨水道。"], ["reflection", "rɪˈflekʃən", "倒影", "The reflection dances on the water.", "倒影在水面上摇曳。"], ["scenery", "ˈsiːnəri", "风景", "The scenery is beautiful.", "这里风景优美。"], ["tranquil", "ˈtræŋkwɪl", "宁静的", "The canal is tranquil.", "水道很宁静。"]], [["meaningful", "ˈmiːnɪŋfəl", "有意义的", "It was a meaningful journey.", "这是一次有意义的旅程。"], ["happiness", "ˈhæpinəs", "幸福", "Sharing brings happiness.", "分享带来幸福。"], ["affection", "əˈfekʃən", "关爱", "They show affection for one another.", "他们彼此表达关爱。"], ["bond", "bɑːnd", "情谊", "Their shared memories strengthen their bond.", "共同的回忆加深了他们的情谊。"]]]};let i=0;const sel=document.getElementById('sel');data.titles.forEach((x,n)=>{let o=document.createElement('option');o.value=n;o.textContent='第 '+n+' 集 · '+x;sel.appendChild(o)});function render(){document.getElementById('pic').src='assets/'+String(i).padStart(2,'0')+'.jpg';document.getElementById('pic').alt='第'+i+'集 '+data.titles[i];document.getElementById('title').textContent='第 '+i+' 集 · '+data.titles[i];document.getElementById('count').textContent=(i+1)+' / 11';let box=document.getElementById('words');box.replaceChildren();data.entries[i].forEach(([w,ipa,meaning,en,zh])=>{let card=document.createElement('div');card.className='worditem';let line=document.createElement('div'),name=document.createElement('span'),ph=document.createElement('span'),m=document.createElement('div'),e=document.createElement('div'),t=document.createElement('div');name.className='wordtitle';name.textContent=w;ph.className='ipa';ph.textContent='/'+ipa+'/';m.className='meaning';m.textContent=meaning;e.className='example';e.textContent=en;t.className='translation';t.textContent=zh;line.append(name,ph);card.append(line,m,e,t);box.append(card)});sel.value=i;document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===10}sel.onchange=()=>{i=+sel.value;render()};document.getElementById('prev').onclick=()=>{i--;render();window.scrollTo(0,0)};document.getElementById('next').onclick=()=>{i++;render();window.scrollTo(0,0)};render();</script></html>
